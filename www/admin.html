<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Admin Portal</title>
<link rel="stylesheet" href="css/styles.output.css" />

<body class="bp-admin-shell font-sans text-espresso-900 h-screen w-screen overflow-hidden flex flex-col relative">
  <!-- Animated background elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-20 w-64 h-64 bg-emerald-400/5 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-20 right-20 w-80 h-80 bg-emerald-500/5 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>
  </div>

  <!-- Enhanced Header -->
  <header class="shrink-0 min-h-16 bg-gradient-to-r from-espresso-950 via-espresso-900 to-espresso-950 text-cream-50 flex items-center justify-between px-3 sm:px-5 shadow-2xl z-20 relative overflow-visible py-2">
    <!-- Decorative gradient overlay -->

    <div class="flex items-center gap-2 sm:gap-2.5 relative z-10">
      <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-emerald-400 via-emerald-500 to-emerald-600 flex items-center justify-center text-white text-lg sm:text-xl shadow-2xl shadow-emerald-500/40 transform hover:scale-105 transition-transform duration-200">📊</div>
      <div class="leading-tight">
        <p id="shop-name" class="font-display font-bold text-base sm:text-lg">Admin Portal</p>
        <p class="text-[10px] sm:text-[11px] text-emerald-200 font-medium hidden sm:block">Sales, inventory &amp; operations</p>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3 relative z-10">
      <button id="sync-pill" class="hidden flex items-center gap-1.5 text-xs bg-gradient-to-r from-emerald-800 to-emerald-700 hover:from-emerald-700 hover:to-emerald-600 rounded-full px-2 sm:px-3 py-1.5 bp-tap shadow-xl border border-emerald-600 transition-all hover:shadow-2xl hover:-translate-y-0.5">
        <span id="sync-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="sync-label" class="inline sm:inline">Syncing...</span>
      </button>
      <span id="live-pill" class="hidden sm:flex items-center gap-1.5 text-xs bg-gradient-to-r from-emerald-600 to-emerald-700 rounded-full px-3 py-1.5 shadow-xl shadow-emerald-500/30 animate-pulse">
        <span class="w-2 h-2 rounded-full bg-emerald-300 bp-pulse"></span> Live
      </span>
      <a href="app.html" class="text-xs bg-gradient-to-r from-amber-500 via-amber-600 to-amber-700 hover:from-amber-400 hover:to-amber-500 rounded-full px-3 sm:px-4 py-1.5 bp-tap font-bold shadow-xl shadow-amber-500/30 transition-all whitespace-nowrap transform hover:scale-105 hover:shadow-2xl hover:-translate-y-0.5">� POS</a>

      <div class="relative">
        <button id="user-menu-btn" class="flex items-center gap-2 bg-espresso-800 hover:bg-espresso-700 rounded-full pl-1 pr-2 sm:pr-3 py-1 bp-tap border border-espresso-700 shadow-xl transition-all hover:shadow-2xl hover:-translate-y-0.5">
          <span id="user-avatar" class="w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 text-white text-xs font-bold flex items-center justify-center shadow-lg">?</span>
          <span id="user-name" class="text-xs sm:text-sm hidden sm:inline font-semibold">…</span>
        </button>
        <div id="user-menu" class="hidden absolute right-0 mt-2 w-48 sm:w-52 bg-white/95 backdrop-blur-xl text-espresso-900 rounded-2xl shadow-2xl overflow-hidden border border-espresso-100 z-[100]">
          <div class="px-3 sm:px-4 py-2 sm:py-3 border-b border-espresso-100 bg-gradient-to-r from-cream-50 to-white">
            <p id="user-menu-name" class="font-bold text-xs sm:text-sm">—</p>
            <p id="user-menu-role" class="text-[10px] sm:text-xs text-espresso-500 capitalize font-medium">—</p>
          </div>
          <a href="app.html" class="px-3 sm:px-4 py-2 sm:py-3 text-xs sm:text-sm text-espresso-700 hover:bg-cream-100 font-bold border-b border-espresso-100 flex items-center gap-2 transition-colors">
            <span>�</span> Back to POS
          </a>
          <button id="dropdown-logout-btn" class="w-full text-left px-3 sm:px-4 py-2 sm:py-3 text-xs sm:text-sm text-rust-600 hover:bg-rust-50 font-bold flex items-center gap-2 transition-colors">
            <span>🚪</span> Log out
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden relative z-10">
    <!-- Enhanced Desktop Sidebar -->
    <nav class="hidden sm:flex flex-col w-16 md:w-20 lg:w-56 bp-admin-nav text-espresso-200 shrink-0 relative">
      <div class="absolute inset-0 bg-gradient-to-b from-emerald-500/5 to-transparent pointer-events-none"></div>
      <button data-tab="dashboard" class="bp-nav-btn flex items-center gap-2 sm:gap-3 px-3 sm:px-4 md:px-6 py-3 sm:py-4 text-xs sm:text-sm font-bold transition-colors relative z-10 hover:bg-white/10">
        <span class="text-base sm:text-lg">⚡</span><span class="hidden md:inline font-bold">Dashboard</span>
      </button>
      <button data-tab="inventory" class="bp-nav-btn flex items-center gap-2 sm:gap-3 px-3 sm:px-4 md:px-6 py-3 sm:py-4 text-xs sm:text-sm font-bold transition-colors relative z-10 hover:bg-white/10">
        <span class="text-base sm:text-lg">📦</span><span class="hidden md:inline font-bold">Inventory</span>
      </button>
      <button data-tab="pos" class="bp-nav-btn flex items-center gap-2 sm:gap-3 px-3 sm:px-4 md:px-6 py-3 sm:py-4 text-xs sm:text-sm font-bold transition-colors relative z-10 hover:bg-white/10">
        <span class="text-base sm:text-lg">�</span><span class="hidden md:inline font-bold">POS</span>
      </button>
      <button data-tab="order-history" class="bp-nav-btn flex items-center gap-2 sm:gap-3 px-3 sm:px-4 md:px-6 py-3 sm:py-4 text-xs sm:text-sm font-bold transition-colors relative z-10 hover:bg-white/10">
        <span class="text-base sm:text-lg">📜</span><span class="hidden md:inline font-bold">Order History</span>
      </button>
      <button data-tab="sales-tracker" class="bp-nav-btn flex items-center gap-2 sm:gap-3 px-3 sm:px-4 md:px-6 py-3 sm:py-4 text-xs sm:text-sm font-bold transition-colors relative z-10 hover:bg-white/10">
        <span class="text-base sm:text-lg">📈</span><span class="hidden md:inline font-bold">Sales Tracker</span>
      </button>
      <button data-tab="settings" class="bp-nav-btn flex items-center gap-2 sm:gap-3 px-3 sm:px-4 md:px-6 py-3 sm:py-4 text-xs sm:text-sm font-bold transition-colors relative z-10 hover:bg-white/10">
        <span class="text-base sm:text-lg">⚙️</span><span class="hidden md:inline font-bold">Settings</span>
      </button>
      <div class="mt-auto"></div>
      <button data-action="logout" class="bp-nav-btn flex items-center gap-2 sm:gap-3 px-3 sm:px-4 md:px-6 py-3 sm:py-4 text-xs sm:text-sm font-bold transition-colors relative z-10 text-rust-300 hover:text-rust-200 hover:bg-white/10">
        <span class="text-base sm:text-lg">🚪</span><span class="hidden md:inline font-bold">Logout</span>
      </button>
    </nav>

    <!-- Main Content Area -->
    <main id="admin-main" class="flex-1 min-w-0 relative bg-gradient-to-br from-cream-50/50 to-amber-50/30 backdrop-blur-sm min-h-0">
      <!-- Slideshow Container -->
      <div id="slideshow-container" class="relative w-full h-full overflow-hidden">
        <div id="slideshow-track" class="flex transition-transform duration-500 ease-in-out h-full">
          <section id="view-dashboard" class="bp-view w-full h-full min-h-0 flex-shrink-0 overflow-y-auto bp-scroll"></section>
          <section id="view-inventory" class="bp-view w-full h-full min-h-0 flex-shrink-0 overflow-y-auto bp-scroll"></section>
          <section id="view-pos" class="bp-view w-full h-full min-h-0 flex-shrink-0"></section>
          <section id="view-order-history" class="bp-view w-full h-full min-h-0 flex-shrink-0 overflow-y-auto bp-scroll"></section>
          <section id="view-sales-tracker" class="bp-view w-full h-full min-h-0 flex-shrink-0 overflow-y-auto bp-scroll"></section>
          <section id="view-settings" class="bp-view w-full h-full min-h-0 flex-shrink-0 overflow-y-auto bp-scroll"></section>
        </div>

        <!-- Slideshow Navigation Arrows -->
        <button id="slide-prev" class="absolute left-2 top-1/2 -translate-y-1/2 z-30 w-10 h-10 bg-white/90 hover:bg-white rounded-full shadow-lg flex items-center justify-center text-espresso-900 transition-all hover:scale-110 opacity-0 hover:opacity-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <button id="slide-next" class="absolute right-2 top-1/2 -translate-y-1/2 z-30 w-10 h-10 bg-white/90 hover:bg-white rounded-full shadow-lg flex items-center justify-center text-espresso-900 transition-all hover:scale-110 opacity-0 hover:opacity-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </button>

        <!-- Slideshow Dots -->
        <div id="slide-dots" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-30 flex gap-2">
          <button data-slide="0" class="slide-dot w-2 h-2 rounded-full bg-espresso-300/50 hover:bg-espresso-500 transition-all"></button>
          <button data-slide="1" class="slide-dot w-2 h-2 rounded-full bg-espresso-300/50 hover:bg-espresso-500 transition-all"></button>
          <button data-slide="2" class="slide-dot w-2 h-2 rounded-full bg-espresso-300/50 hover:bg-espresso-500 transition-all"></button>
          <button data-slide="3" class="slide-dot w-2 h-2 rounded-full bg-espresso-300/50 hover:bg-espresso-500 transition-all"></button>
          <button data-slide="4" class="slide-dot w-2 h-2 rounded-full bg-espresso-300/50 hover:bg-espresso-500 transition-all"></button>
          <button data-slide="5" class="slide-dot w-2 h-2 rounded-full bg-espresso-300/50 hover:bg-espresso-500 transition-all"></button>
        </div>
      </div>
    </main>
  </div>

  <!-- Custom Modal Dialog -->
  <div id="custom-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-espresso-950/70 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 overflow-hidden transform transition-all">
      <div class="bg-gradient-to-r from-espresso-900 to-espresso-800 px-6 py-4">
        <h3 id="modal-title" class="text-lg font-bold text-cream-50">Confirm</h3>
      </div>
      <div class="p-6">
        <p id="modal-message" class="text-espresso-900 text-sm leading-relaxed"></p>
      </div>
      <div class="bg-cream-50 px-6 py-4 flex justify-end gap-3">
        <button id="modal-cancel" class="px-4 py-2 rounded-lg text-sm font-bold text-espresso-700 hover:bg-espresso-200 transition-colors">Cancel</button>
        <button id="modal-confirm" class="px-4 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition-colors shadow-lg">OK</button>
      </div>
    </div>
  </div>

  <!-- Enhanced Mobile Bottom Navigation -->
  <nav class="sm:hidden shrink-0 bg-espresso-950 text-espresso-200 flex justify-around border-t border-espresso-800 relative overflow-hidden z-20">
    <div class="absolute inset-0 bg-gradient-to-r from-amber-500/10 via-transparent to-emerald-500/10 pointer-events-none"></div>
    <button data-tab="dashboard" class="bp-nav-btn flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[10px] font-bold relative z-10 hover:bg-white/10 transition-colors">
      <span class="text-base sm:text-lg">⚡</span>Dashboard
    </button>
    <button data-tab="inventory" class="bp-nav-btn flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[10px] font-bold relative z-10 hover:bg-white/10 transition-colors">
      <span class="text-base sm:text-lg">📦</span>Inventory
    </button>
    <button data-tab="pos" class="bp-nav-btn flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[10px] font-bold relative z-10 hover:bg-white/10 transition-colors">
      <span class="text-base sm:text-lg">�</span>POS
    </button>
    <button data-tab="order-history" class="bp-nav-btn flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[10px] font-bold relative z-10 hover:bg-white/10 transition-colors">
      <span class="text-base sm:text-lg">📜</span>History
    </button>
    <button data-tab="sales-tracker" class="bp-nav-btn flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[10px] font-bold relative z-10 hover:bg-white/10 transition-colors">
      <span class="text-base sm:text-lg">📈</span>Sales
    </button>
    <button data-tab="settings" class="bp-nav-btn flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[10px] font-bold relative z-10 hover:bg-white/10 transition-colors">
      <span class="text-base sm:text-lg">⚙️</span>Settings
    </button>
    <button data-action="logout" class="bp-nav-btn flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[10px] font-bold text-rust-200 relative z-10 hover:bg-white/10 transition-colors">
      <span class="text-base sm:text-lg">🚪</span>Logout
    </button>
  </nav>

  <script>
    // Slideshow functionality
    document.addEventListener('DOMContentLoaded', function() {
      const track = document.getElementById('slideshow-track');
      const prevBtn = document.getElementById('slide-prev');
      const nextBtn = document.getElementById('slide-next');
      const dots = document.querySelectorAll('.slide-dot');
      const navBtns = document.querySelectorAll('.bp-nav-btn[data-tab]');

      let currentSlide = 0;
      const totalSlides = 6;
      const slideNames = ['dashboard', 'inventory', 'pos', 'order-history', 'sales-tracker', 'settings'];

      function goToSlide(index) {
        if (index < 0) index = totalSlides - 1;
        if (index >= totalSlides) index = 0;

        currentSlide = index;
        track.style.transform = `translateX(-${currentSlide * 100}%)`;

        // Update dots
        dots.forEach((dot, i) => {
          dot.classList.toggle('active', i === currentSlide);
        });

        // Update nav buttons
        navBtns.forEach(btn => {
          const tab = btn.getAttribute('data-tab');
          if (tab === slideNames[currentSlide]) {
            btn.classList.add('bg-espresso-900');
          } else {
            btn.classList.remove('bg-espresso-900');
          }
        });
      }

      // Navigation arrows
      prevBtn.addEventListener('click', () => goToSlide(currentSlide - 1));
      nextBtn.addEventListener('click', () => goToSlide(currentSlide + 1));

      // Dot navigation
      dots.forEach((dot, index) => {
        dot.addEventListener('click', () => goToSlide(index));
      });

      // Nav button navigation
      navBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.getAttribute('data-tab');
          const index = slideNames.indexOf(tab);
          if (index !== -1) {
            goToSlide(index);
          }
        });
      });

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') goToSlide(currentSlide - 1);
        if (e.key === 'ArrowRight') goToSlide(currentSlide + 1);
      });

      // Touch/swipe support
      let touchStartX = 0;
      let touchEndX = 0;

      track.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      });

      track.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      });

      function handleSwipe() {
        const swipeThreshold = 50;
        const diff = touchStartX - touchEndX;

        if (Math.abs(diff) > swipeThreshold) {
          if (diff > 0) {
            goToSlide(currentSlide + 1);
          } else {
            goToSlide(currentSlide - 1);
          }
        }
      }

      // Initialize first slide
      goToSlide(0);
    });
  </script>

  <script type="module">
    console.log("Admin HTML: Script loading...");
    import("./js/admin-app.js").then(() => {
      console.log("Admin HTML: admin-app.js loaded successfully");
    }).catch(err => {
      console.error("Admin HTML: Failed to load admin-app.js:", err);
    });
  </script>
</body>
</html>
