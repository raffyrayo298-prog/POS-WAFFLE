<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1b110a" />
<title>Sign in · Waffle King POS</title>

<link rel="stylesheet" href="css/styles.output.css" />
</head>
<body class="bg-gradient-to-br from-espresso-950 via-espresso-900 to-espresso-950 min-h-screen font-sans relative overflow-x-hidden overflow-y-auto">
  <!-- Animated background elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-64 h-64 sm:w-96 sm:h-96 bg-amber-500/10 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-1/4 right-1/4 w-64 h-64 sm:w-96 sm:h-96 bg-amber-600/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
  </div>

  <div class="w-full max-w-md mx-auto relative z-10 py-6 sm:py-8 px-3 sm:px-4 min-h-screen flex flex-col justify-center">
    <div class="mb-6 flex justify-start">
      <a href="index.html" class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/10 backdrop-blur-sm px-4 py-2.5 text-sm font-medium text-cream-50 transition-all hover:bg-white/20 hover:shadow-xl hover:scale-105" aria-label="Back to landing page">
        <span aria-hidden="true">←</span>
        <span>Back</span>
      </a>
    </div>

    <div class="text-center mb-6 sm:mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-3xl bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 text-white text-3xl sm:text-4xl mb-4 sm:mb-6 shadow-2xl shadow-amber-500/40 transform hover:scale-110 transition-transform duration-300">🧇</div>
      <h1 class="font-display text-3xl sm:text-4xl text-cream-50 font-bold tracking-tight mb-2">Waffle King POS</h1>
      <p class="text-amber-200 text-sm sm:text-base mt-2 font-light">Sign in to open the register</p>
    </div>

    <form id="login-form" class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-5 sm:p-8 md:p-10 flex flex-col gap-4 sm:gap-5 border border-white/20">
      <div id="error-box" role="alert" aria-live="assertive" class="hidden bg-rust-50 text-rust-700 text-sm rounded-xl px-4 py-3 border border-rust-200"></div>
      <div id="success-box" role="status" aria-live="polite" class="hidden bg-sage-50 text-sage-700 text-sm rounded-xl px-4 py-3 border border-sage-200"></div>

      <label class="flex flex-col gap-2">
        <span class="text-sm font-semibold text-espresso-800">Email</span>
        <input required type="email" name="email" autocomplete="username"
          class="rounded-2xl border border-espresso-200 bg-white px-4 sm:px-5 py-3 sm:py-4 text-sm sm:text-base text-espresso-900 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all shadow-sm"
          placeholder="you@waffleking.com" />
      </label>

      <label class="flex flex-col gap-2">
        <span class="text-sm font-semibold text-espresso-800">Password</span>
        <div class="relative">
          <input required type="password" name="password" autocomplete="current-password" minlength="6"
            class="w-full rounded-2xl border border-espresso-200 bg-white px-4 sm:px-5 py-3 sm:py-4 pr-14 text-sm sm:text-base text-espresso-900 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all shadow-sm"
            placeholder="••••••••" />
          <button type="button" class="password-toggle absolute inset-y-0 right-3 sm:right-4 flex items-center text-xs font-semibold text-espresso-600 hover:text-amber-600 transition-colors" data-target="password" aria-label="Show password">Show</button>
        </div>
      </label>

      <button type="submit" id="submit-btn"
        class="bp-tap mt-2 sm:mt-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-white font-bold rounded-2xl py-3.5 sm:py-4 text-sm sm:text-base shadow-lg shadow-amber-500/30 disabled:cursor-not-allowed disabled:opacity-70 transition-all hover:shadow-xl hover:shadow-amber-500/40 hover:-translate-y-0.5">
        Sign in
      </button>

      <div class="border-t border-espresso-200 pt-4 sm:pt-5 mt-2">
        <p class="text-center text-xs sm:text-sm text-espresso-600 mb-2 sm:mb-3">Don't have an account?</p>
        <a href="signup.html" class="block text-center text-xs sm:text-sm font-bold text-amber-600 hover:text-amber-700 transition-colors">Create an account →</a>
      </div>

      <div class="mt-3 text-center">
        <a href="admin-login.html" class="text-xs sm:text-sm font-semibold text-espresso-500 hover:text-amber-500 transition-colors">Admin login</a>
      </div>
    </form>
  </div>

  <script type="module">
    import { auth } from "./js/backend.js";
    import { clearRedirectGuard } from "./js/auth-guard.js";

    const currentUser = auth.getCurrentUser?.();
    if (currentUser) {
      clearRedirectGuard();
      const target = currentUser.role === "admin" ? "admin.html" : "app.html";
      window.location.replace(target);
    }

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error-box");
    const successBox = document.getElementById("success-box");
    const submitBtn = document.getElementById("submit-btn");

    document.querySelectorAll(".password-toggle").forEach((button) => {
      button.addEventListener("click", () => {
        const input = form.querySelector(`[name="${button.dataset.target}"]`);
        if (!input) return;
        const shouldShow = input.type === "password";
        input.type = shouldShow ? "text" : "password";
        button.textContent = shouldShow ? "Hide" : "Show";
        button.setAttribute("aria-label", shouldShow ? "Hide password" : "Show password");
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearRedirectGuard();
      errorBox.classList.add("hidden");
      successBox.classList.add("hidden");

      const email = form.querySelector("[name='email']").value.trim();
      const password = form.querySelector("[name='password']").value;

      if (!email || !email.includes('@')) {
        errorBox.textContent = "Please enter a valid email address.";
        errorBox.classList.remove("hidden");
        return;
      }

      if (!password || password.length < 6) {
        errorBox.textContent = "Password must be at least 6 characters.";
        errorBox.classList.remove("hidden");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      try {
        const user = await auth.signIn({ email, password });
        clearRedirectGuard();
        successBox.textContent = "Login successful! Redirecting...";
        successBox.classList.remove("hidden");

        const target = user.role === "admin" ? "admin.html" : "app.html";
        setTimeout(() => {
          clearRedirectGuard();
          window.location.replace(target);
        }, 300);
      } catch (err) {
        let errorMessage = "Couldn't sign in.";
        if (err.message.includes("auth/invalid-credential") || err.message.includes("wrong-password") || err.message.includes("incorrect password")) {
          errorMessage = "Invalid email or password. Please try again.";
        } else if (err.message.includes("auth/user-not-found") || err.message.includes("No account found")) {
          errorMessage = "No account found with this email. Please sign up first.";
        } else if (err.message.includes("auth/too-many-requests")) {
          errorMessage = "Too many failed attempts. Please try again later.";
        } else if (err.message.includes("network") || err.message.includes("fetch")) {
          errorMessage = "Network error. Please check your connection.";
        } else {
          errorMessage = err.message || "Couldn't sign in.";
        }

        errorBox.textContent = errorMessage;
        errorBox.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });
  </script>

  <!-- Custom Modal Dialog -->
  <div id="custom-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-espresso-950/70 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 overflow-hidden transform transition-all">
      <div class="bg-gradient-to-r from-espresso-900 to-espresso-800 px-6 py-4">
        <h3 id="modal-title" class="text-lg font-bold text-cream-50">Confirm</h3>
      </div>
      <div class="p-6">
        <p id="modal-message" class="text-espresso-900 text-sm leading-relaxed"></p>
      </div>
      <div class="bg-cream-50 px-6 py-4 flex justify-end gap-3">
        <button id="modal-cancel" class="px-4 py-2 rounded-lg text-sm font-bold text-espresso-700 hover:bg-espresso-200 transition-colors">Cancel</button>
        <button id="modal-confirm" class="px-4 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition-colors shadow-lg">OK</button>
      </div>
    </div>
  </div>
</body>
</html>
